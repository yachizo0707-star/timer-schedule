<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日のタイムスケジュール管理</title>
<style>
  :root{
    --bg:#f4f5f3; --card:#fff; --ink:#1c241d; --sub:#6b756c;
    --study:#ffffff; --studyborder:#2a3a2c;
    --break:#ededed; --breakborder:#9a9a9a;
    --rest:#5b5b5b; --restborder:#333;
    --now:#dff3df; --nowborder:#2f8f3f;
    --done:#cfe8cf;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:"Hiragino Sans","Yu Gothic",-apple-system,sans-serif;color:var(--ink);padding-bottom:40px}
  header{position:sticky;top:0;background:var(--ink);color:#fff;padding:14px 16px;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  header h1{margin:0;font-size:16px}
  .clock{font-size:28px;font-weight:700;letter-spacing:1px;margin-top:2px}
  .now-panel{margin:12px;padding:16px;border-radius:14px;background:var(--now);border:2px solid var(--nowborder)}
  .now-panel .label{font-size:11px;color:#2f6b36;font-weight:700;letter-spacing:1px}
  .now-panel .task{font-size:19px;font-weight:700;margin:4px 0 8px}
  .now-panel .timer{font-size:40px;font-weight:800;color:#215227;font-variant-numeric:tabular-nums}
  .now-panel .range{font-size:12px;color:#4a6a4d;margin-top:4px}
  .next-up{margin-top:10px;font-size:13px;color:#2f6b36;font-weight:700}
  .progress-outer{height:10px;border-radius:6px;background:#c6dec8;margin-top:10px;overflow:hidden}
  .progress-inner{height:100%;background:#2f8f3f;width:0%;transition:width .3s}
  .done-banner{margin:12px;padding:18px;border-radius:14px;background:#2f8f3f;color:#fff;text-align:center;font-size:18px;font-weight:700}
  .list{margin:0 12px 12px}
  .item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;margin-bottom:6px;border:1.5px solid var(--studyborder);background:var(--study)}
  .item.break_{border-color:var(--breakborder);background:var(--break)}
  .item.rest{border-color:var(--restborder);background:var(--rest);color:#fff}
  .item.active{border-color:var(--nowborder);background:var(--now);box-shadow:0 0 0 2px rgba(47,143,63,.25)}
  .item.done{background:var(--done);opacity:.65}
  .item .time{width:90px;flex:0 0 auto;font-size:12px;font-weight:700;text-align:center;line-height:1.3}
  .item .body{flex:1 1 auto;font-size:13px}
  .item .subj{font-weight:700;margin-right:6px;text-decoration:underline}
  .item .chk{width:26px;height:26px;border-radius:7px;border:2px solid currentColor;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;background:rgba(255,255,255,.5)}
  .item.done .chk{background:#2f8f3f;color:#fff;border-color:#2f8f3f}
  .legend{display:flex;gap:14px;margin:0 12px 14px;font-size:11px;color:var(--sub);flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:4px}
  .sw{width:10px;height:10px;border-radius:3px;display:inline-block;border:1.3px solid #333}
  .controls{margin:0 12px 16px;display:flex;gap:8px}
  .controls button{flex:1;padding:10px;border-radius:10px;border:none;font-size:13px;font-weight:700;cursor:pointer}
  .btn-reset{background:#e2e2e2;color:#333}
  .btn-sound{background:#2a3a2c;color:#fff}
</style>
</head>
<body>
<header>
  <h1>今日のタイムスケジュール　10/18(日)</h1>
  <div class="clock" id="clock">--:--:--</div>
</header>

<div id="nowArea"></div>

<div class="controls">
  <button class="btn-sound" id="soundBtn">🔔 音を有効にする</button>
  <button class="btn-reset" id="resetBtn">チェックを全部リセット</button>
</div>

<div class="legend">
  <span><span class="sw" style="background:#fff"></span>学習</span>
  <span><span class="sw" style="background:#ededed"></span>休憩</span>
  <span><span class="sw" style="background:#5b5b5b"></span>昼休み・夕食</span>
  <span><span class="sw" style="background:#dff3df"></span>今やること</span>
</div>

<div class="list" id="list"></div>

<script>
// ---- 今日のスケジュール（開始・終了は"HH:MM"） ----
var SCHEDULE = [
  {start:"08:40", end:"11:30", type:"study", subj:"代数", text:"問題集 vol.2/vol.3 全19問　→完了!"},
  {start:"11:30", end:"12:00", type:"study", subj:"英語", text:"NEW TREASURE P87〜88(2ページ)"},
  {start:"12:00", end:"13:00", type:"rest",  subj:"",   text:"昼休み"},
  {start:"13:00", end:"13:25", type:"study", subj:"英語", text:"P89(1ページ)　→英語完了!"},
  {start:"13:25", end:"13:35", type:"break", subj:"",   text:"休憩"},
  {start:"13:35", end:"14:35", type:"study", subj:"国語", text:"徹底演習 106〜108ページ"},
  {start:"14:35", end:"14:45", type:"break", subj:"",   text:"休憩"},
  {start:"14:45", end:"15:27", type:"study", subj:"国語", text:"徹底演習 109〜110ページ(仕上げ)　→今日分の国語完了!"},
  {start:"15:27", end:"15:40", type:"break", subj:"",   text:"休憩"},
  {start:"15:40", end:"16:30", type:"study", subj:"社会", text:"問題集 P108〜111(4ページ)"},
  {start:"16:30", end:"16:40", type:"break", subj:"",   text:"休憩"},
  {start:"16:40", end:"17:30", type:"study", subj:"社会", text:"問題集 P112〜115(4ページ)　→今日分の社会完了!"},
  {start:"17:30", end:"17:40", type:"break", subj:"",   text:"休憩"},
  {start:"17:40", end:"18:10", type:"rest",  subj:"",   text:"夕食休憩"},
  {start:"18:10", end:"19:00", type:"study", subj:"地学", text:"P72〜76(5ページ)"},
  {start:"19:00", end:"19:10", type:"break", subj:"",   text:"休憩"},
  {start:"19:10", end:"20:00", type:"study", subj:"地学", text:"P77〜81(5ページ)　→地学完了!"},
  {start:"20:00", end:"20:10", type:"break", subj:"",   text:"休憩"},
  {start:"20:10", end:"21:00", type:"study", subj:"物理", text:"P8〜12(5ページ)"},
  {start:"21:00", end:"21:10", type:"break", subj:"",   text:"休憩"},
  {start:"21:10", end:"21:50", type:"study", subj:"物理", text:"P13〜16(4ページ・いけるところまで)"}
];

var STORAGE_KEY = "today_schedule_done_1018";
var soundOn = false;

function toMinutes(hhmm){
  var p = hhmm.split(":");
  return parseInt(p[0],10)*60+parseInt(p[1],10);
}
function fmtClock(d){
  function p2(n){return (n<10?"0":"")+n;}
  return p2(d.getHours())+":"+p2(d.getMinutes())+":"+p2(d.getSeconds());
}
function fmtMMSS(totalSec){
  if(totalSec<0) totalSec=0;
  var m = Math.floor(totalSec/60), s = totalSec%60;
  function p2(n){return (n<10?"0":"")+n;}
  return p2(m)+":"+p2(s);
}
function loadDone(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }catch(e){ return {}; }
}
function saveDone(d){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }catch(e){}
}
var doneMap = loadDone();

function nowMinutesSeconds(){
  var now = new Date();
  return {m: now.getHours()*60+now.getMinutes(), s: now.getSeconds(), d: now};
}

// 音を鳴らすには、ユーザーの操作(ボタンタップ)の中で一度AudioContextを
// 作成・再生しておく必要がある(特にiPhone Safari)。作ったcontextは
// 保持して再利用する。
var audioCtx = null;
function ensureAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
  if(audioCtx && audioCtx.state === "suspended"){
    audioCtx.resume().catch(function(){});
  }
  return audioCtx;
}
function beep(times){
  if(!soundOn) return;
  var ctx = ensureAudioCtx();
  if(!ctx) return;
  times = times || 1;
  for(var k=0;k<times;k++){
    (function(delay){
      try{
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = "sine"; o.frequency.value = 880;
        var t0 = ctx.currentTime + delay;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.3, t0+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0+0.45);
        o.start(t0); o.stop(t0+0.5);
      }catch(e){}
    })(k*0.6);
  }
}

// 「次の行動」を音声でアナウンスする
function speak(text){
  if(!soundOn) return;
  try{
    if(!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP";
    u.rate = 1.0;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function speakableText(it){
  var kind = it.type==="break" ? "休憩です" : (it.type==="rest" ? it.text+"です" : (it.subj?it.subj+"、":"")+it.text);
  return kind;
}

var lastActiveIdx = -1;
var warned60 = {};

function render(){
  var listEl = document.getElementById("list");
  var now = nowMinutesSeconds();
  var nowMin = now.m, nowSec = now.s;
  document.getElementById("clock").textContent = fmtClock(now.d);

  var activeIdx = -1;
  for(var i=0;i<SCHEDULE.length;i++){
    var s = toMinutes(SCHEDULE[i].start), e = toMinutes(SCHEDULE[i].end);
    if(nowMin>=s && nowMin<e){ activeIdx = i; break; }
  }

  if(activeIdx!==lastActiveIdx && lastActiveIdx!==-1){
    beep(2);
    if(activeIdx!==-1){
      speak("次は、"+speakableText(SCHEDULE[activeIdx]));
    } else {
      speak("今日の予定はすべて終わりました。お疲れさまでした。");
    }
  }
  lastActiveIdx = activeIdx;

  // 終了1分前に予告アナウンス(1回だけ)
  if(activeIdx!==-1){
    var endMin = toMinutes(SCHEDULE[activeIdx].end);
    var secToEnd = (endMin - nowMin)*60 - nowSec;
    if(secToEnd<=60 && secToEnd>0 && !warned60[activeIdx]){
      warned60[activeIdx] = true;
      var nextIdx = activeIdx+1;
      if(nextIdx < SCHEDULE.length){
        speak("あと1分で、"+speakableText(SCHEDULE[nextIdx])+"に移ります");
      } else {
        speak("あと1分で今日の予定が終わります");
      }
      beep(1);
    }
  }

  // now panel
  var nowArea = document.getElementById("nowArea");
  if(activeIdx===-1){
    var allDone = SCHEDULE.every(function(it,idx){ return doneMap[idx]; });
    var afterLast = nowMin >= toMinutes(SCHEDULE[SCHEDULE.length-1].end);
    if(afterLast){
      nowArea.innerHTML = '<div class="done-banner">🎉 今日の予定はすべて終了時刻を過ぎました！お疲れさまでした。</div>';
    } else {
      nowArea.innerHTML = '<div class="now-panel"><div class="label">次の予定までお待ちください</div><div class="task">—</div></div>';
    }
  } else {
    var it = SCHEDULE[activeIdx];
    var e = toMinutes(it.end);
    var remainSec = (e - nowMin)*60 - nowSec;
    var totalSec = (toMinutes(it.end)-toMinutes(it.start))*60;
    var elapsedSec = totalSec - remainSec;
    var pct = Math.max(0, Math.min(100, (elapsedSec/totalSec)*100));
    var labelMap = {study:"いま取り組むこと", "break":"休憩中", rest:(it.text.indexOf("昼")>-1?"昼休み中":"夕食休憩中")};
    var cls = it.type==="break" ? "休憩中" : (it.type==="rest" ? it.text : "いま取り組むこと");
    var nextIt = SCHEDULE[activeIdx+1];
    var nextHtml = nextIt
      ? '<div class="next-up">次 → '+(nextIt.subj?('<b>'+nextIt.subj+'</b> '):'')+nextIt.text+'</div>'
      : '<div class="next-up">これが最後の予定です</div>';
    nowArea.innerHTML =
      '<div class="now-panel">'+
        '<div class="label">'+cls+'</div>'+
        '<div class="task">'+(it.subj?('<b>'+it.subj+'</b> '):'')+it.text+'</div>'+
        '<div class="timer">残り '+fmtMMSS(remainSec)+'</div>'+
        '<div class="range">'+it.start+' 〜 '+it.end+'</div>'+
        '<div class="progress-outer"><div class="progress-inner" style="width:'+pct+'%"></div></div>'+
        nextHtml+
      '</div>';
  }

  // list
  var html = "";
  for(var j=0;j<SCHEDULE.length;j++){
    var row = SCHEDULE[j];
    var typeClass = row.type==="break" ? "break_" : (row.type==="rest" ? "rest" : "");
    var isActive = (j===activeIdx);
    var isDone = !!doneMap[j];
    var cls2 = "item "+typeClass+(isActive?" active":"")+(isDone?" done":"");
    html += '<div class="'+cls2+'" data-idx="'+j+'">'+
      '<div class="time">'+row.start+'<br>〜'+row.end+'</div>'+
      '<div class="body">'+(row.subj?('<span class="subj">'+row.subj+'</span>'):'')+row.text+'</div>'+
      '<div class="chk" data-idx="'+j+'">'+(isDone?'✓':'')+'</div>'+
    '</div>';
  }
  listEl.innerHTML = html;

  var chks = listEl.querySelectorAll(".chk");
  chks.forEach(function(chk){
    chk.onclick = function(ev){
      ev.stopPropagation();
      var idx = this.getAttribute("data-idx");
      doneMap[idx] = !doneMap[idx];
      saveDone(doneMap);
      render();
    };
  });
}

document.getElementById("soundBtn").onclick = function(){
  soundOn = !soundOn;
  this.textContent = soundOn ? "🔔 音:オン" : "🔔 音を有効にする";
  if(soundOn){
    // ここでAudioContextと音声合成をユーザー操作の中で一度動かし、
    // 以降スケジュールが切り替わるタイミングで自動再生できるようにする。
    ensureAudioCtx();
    beep(1);
    try{
      if("speechSynthesis" in window){
        var u = new SpeechSynthesisUtterance("音を有効にしました");
        u.lang = "ja-JP";
        window.speechSynthesis.speak(u);
      }
    }catch(e){}
  }
};
document.getElementById("resetBtn").onclick = function(){
  if(confirm("チェックを全部リセットしますか？")){
    doneMap = {};
    saveDone(doneMap);
    render();
  }
};

render();
setInterval(render, 1000);
</script>
</body>
</html>
